
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieRest | My Cart</title>
    <link rel="stylesheet" href="cart.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <div class="navbar">
            <h2>🍴 FoodieRest</h2>

            <nav>
                <a href="customer-menu.html">Menu</a>
                <a href="my-orders.html">My Orders</a>
                <a href="cart.html" class="active">
                    🛒 Cart (<span id="cartCount">0</span>)
                </a>
                <a href="profile.html" id="userName">Hello</a>
                <a href="customer-login.html" onclick="logout()">Logout</a>
            </nav>
        </div>
    </header>

    <!-- Cart Section -->
    <main class="container">

        <h1>Your Cart</h1>

        <div class="cart-layout">

            <!-- Cart Items -->
            <div class="cart-box" id="cartList">
                <!-- JavaScript will show cart items here -->
            </div>

            <!-- Order Summary -->
            <div class="summary">

                <h2>Order Summary</h2>

                <div class="summary-row">
                    <span>Total Items</span>
                    <span id="totalItems">0</span>
                </div>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">Tk 0</span>
                </div>

                <div class="summary-row">
                    <span>Service Charge</span>
                    <span>Tk 0</span>
                </div>

                <div class="summary-row total">
                    <strong>Total Price</strong>
                    <strong id="totalPrice">Tk 0</strong>
                </div>

                <label for="note">Note for kitchen (optional)</label>

                <textarea id="note" placeholder="e.g. less spicy"></textarea>

                <button class="place-order" onclick="placeOrder()">
                    Place Order
                </button>

                <a href="customer-menu.html" class="continue">
                    Continue Shopping
                </a>

            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>© 2026 FoodieRest Restaurant Management System. All rights reserved.</p>
    </footer>

    <!-- JavaScript Files -->
    <script src="customer-storage.js"></script>
    <script src="customer-auth.js"></script>
    <script src="customer.js"></script>

    <script>
        loadCartPage();
    </script>

</body>
</html>
