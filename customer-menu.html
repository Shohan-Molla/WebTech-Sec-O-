
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodieRest | Food Menu</title>
    <link rel="stylesheet" href="customer-menu.css">
</head>
<body>

    <!-- Navbar -->
    <header>
        <div class="navbar">
            <h2>🍴 FoodieRest</h2>

            <nav>
                <a href="customer-menu.html" class="active">Menu</a>
                <a href="my-order.html">My Orders</a>

                <a href="cart.html">
                    🛒 Cart (<span id="cartCount">0</span>)
                </a>

                <a href="profile.html">
                    <span id="userName">Hello</span>
                </a>

                <a href="#" onclick="logout(); return false;">Logout</a>
            </nav>
        </div>
    </header>

    <!-- Main Menu -->
    <main class="container">

        <div class="menu-layout">

            <!-- Categories -->
            <aside class="category" id="categoryList">
                <!-- JavaScript will show categories here -->
            </aside>

            <!-- Food Items -->
            <section class="menu-content">

                <div class="menu-top">
                    <h2>
                        Food Menu:
                        <span id="menuTitle">All</span>
                    </h2>

                    <input
                        type="search"
                        id="search"
                        placeholder="Search food by name..."
                    >
                </div>

                <!-- Message -->
                <p id="menuMessage"></p>

                <!-- Food Cards -->
                <div class="food-grid" id="foodList">
                    <!-- JavaScript will show food cards here -->
                </div>

            </section>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>
            © 2026 FoodieRest Restaurant Management System.
            All rights reserved.
        </p>
    </footer>

    <!-- JavaScript -->
    <script src="customer-storage.js"></script>
    <script src="customer-auth.js"></script>
    <script src="customer.js"></script>

    <script>
        loadMenuPage();
    </script>

</body>
</html>
